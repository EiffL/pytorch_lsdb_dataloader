[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lsdb-torch"
version = "0.1.0"
description = "Stream LSDB (HATS) catalogs into PyTorch DataLoaders, single-node or distributed."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Efficient Catalog.to_delayed(pixels=...) and local schedulers (LSDB PR #1609).
    # Use an immutable revision until this is available in a release.
    "lsdb @ git+https://github.com/EiffL/lsdb.git@a478de002ad7ee073c826ded92f501462bd739a3",
    "torch>=2.0",
    "numpy",
    "pyarrow",
    "dask",
]

[project.optional-dependencies]
checkpoint = ["torchdata>=0.11"]
examples = ["pillow"]
dev = ["pytest", "torchdata>=0.11", "pillow"]

[tool.hatch.metadata]
# Required for the git dependency on the lsdb fork above.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lsdb_torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::RuntimeWarning"]

[tool.black]
line-length = 119
target-version = ["py311"]
